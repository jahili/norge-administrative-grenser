<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Velg norske fylker, kommuner og bydeler, forhåndsvis dem på et kart, og last dem ned som GeoJSON eller TopoJSON."
    />
    <title>Norge – administrative grenser</title>
    <link rel="icon" type="image/png" href="/norge-administrative-grenser/favicon.png" />
    <script>
      // Apply the theme before first paint to avoid flashing the wrong one.
      // Mirrors the logic in src/hooks/useTheme.ts: explicit choice wins,
      // otherwise follow the OS.
      ;(function () {
        var stored = localStorage.getItem('theme')
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
